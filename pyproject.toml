[project]
name = "agentgate"
version = "0.1.0"
description = "A statistical regression gate for AI agents — CI/CD blocking on statistically significant agent regressions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGate contributors" }]
keywords = ["llm", "agents", "evaluation", "ci-cd", "statistics", "regression-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "duckdb>=1.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
live = ["litellm>=1.40"]
embeddings = ["sentence-transformers>=3.0"]
tracing = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
demo = ["streamlit>=1.36", "altair>=5.3"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
agentgate = "agentgate.cli:main"

[project.urls]
Homepage = "https://github.com/agentgate/agentgate"
Documentation = "https://agentgate.github.io/agentgate/"
Repository = "https://github.com/agentgate/agentgate"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle / pyflakes
  "I",              # isort
  "N",              # pep8-naming
  "UP",             # pyupgrade
  "B",              # bugbear
  "C4",             # comprehensions
  "SIM",            # simplify
  "RUF",            # ruff-specific
  "ANN",            # annotations
  "D",              # pydocstyle
  "PT",             # pytest style
  "ARG",            # unused arguments
  "PTH",            # pathlib
  "TID",            # tidy imports
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # allow typing.Any where genuinely needed (documented at each site)
  "N803",   # statistical code uses uppercase args (N, K, B) deliberately
  "N806",   # ... and uppercase locals for matrices/counts
  "D107",   # constructor args are documented in the class docstring (Google convention)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D100", "D101", "D102", "D103", "D104",
  "ANN201", "ANN001", "ARG001",
  "PT018",  # `assert x is not None and x.y == z` is the type-narrowing idiom
]
"demo/**" = ["D100", "D103", "ANN201"]
# Human-facing output legitimately uses typographic characters (x, minus, rho). RUF001-003 exist
# to catch homoglyphs in *code*, not to force ASCII on a report a person reads.
"src/agentgate/report/*" = ["RUF001", "RUF002", "RUF003"]
"src/agentgate/cli.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/**" = ["RUF001", "RUF002", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["agentgate"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agentgate", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "statsmodels.*",
  "duckdb.*",
  "litellm.*",
  "sentence_transformers.*",
  "streamlit.*",
  "altair.*",
  "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "slow: long-running Monte-Carlo statistical validation (run weekly / on stats changes)",
  "live: requires a live LLM provider (never runs in CI PR jobs)",
  "e2e: end-to-end gate runs in replay/mock mode",
]
filterwarnings = ["error::DeprecationWarning:agentgate.*"]

[tool.coverage.run]
source = ["src/agentgate"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
