name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The harness must never reach a provider in CI. Replay mode is enforced by the runner,
  # but we also withhold every credential so a bug cannot silently spend quota.
  AGENTGATE_MODE: replay
  FORCE_COLOR: "1"

jobs:
  quality:
    name: lint · types · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev || uv sync --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: JSON Schemas in sync
        run: uv run agentgate schema check

      # Generated docs must match their sources. A results page that drifts from the evidence is
      # worse than no results page: it presents a stale number with the authority of a fresh one.
      - name: Generated docs in sync
        run: |
          uv run agentgate docs metrics --check
          uv run agentgate docs results --check

      - name: Docs site builds
        run: uv run mkdocs build --strict

      - name: Unit and property tests
        run: uv run pytest -m "not slow and not live" --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
