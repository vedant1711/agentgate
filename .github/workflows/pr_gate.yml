name: PR gate

# The gate itself, running on every pull request (E2).
#
# Two properties this workflow is built around:
#
#   1. It never spends provider quota. Runs execute in mock mode against the deterministic
#      reference brains, so there is nothing to rate-limit and nothing to pay for. A red build
#      here always means the agent changed, never that a free tier throttled.
#   2. Artifacts are uploaded even when the gate fails. A failing gate is exactly when someone
#      needs the report.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AGENTGATE_SUITE: suites/crm_ops
  AGENTGATE_STORE: .agentgate/agentgate.duckdb

jobs:
  gate:
    name: statistical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --dev || uv sync --dev

      # Caches make re-runs free and keep the gate fast. A cold cache is not an error: mock mode
      # regenerates everything deterministically.
      - name: Restore response and run caches
        uses: actions/cache@v4
        with:
          path: |
            .agentgate/cache.sqlite
            .agentgate/agentgate.duckdb
          key: agentgate-${{ runner.os }}-${{ hashFiles('suites/**/*.yaml') }}-${{ github.sha }}
          restore-keys: |
            agentgate-${{ runner.os }}-${{ hashFiles('suites/**/*.yaml') }}-
            agentgate-${{ runner.os }}-

      - name: Run baseline
        run: |
          uv run agentgate run \
            --suite "$AGENTGATE_SUITE" \
            --system baseline \
            --store "$AGENTGATE_STORE" \
            --no-faults \
            --run-id "baseline-${{ github.event.pull_request.base.sha || github.sha }}"

      # The candidate reads FAULT_* from the environment, so a PR can demonstrate a regression
      # by setting one — which is exactly how the pinned example PRs work (K4).
      - name: Run candidate
        env:
          FAULT_PROMPT_DEGRADE: ${{ vars.FAULT_PROMPT_DEGRADE }}
          FAULT_DROP_TOOL: ${{ vars.FAULT_DROP_TOOL }}
          FAULT_MODEL_SWAP: ${{ vars.FAULT_MODEL_SWAP }}
          FAULT_TEMPERATURE: ${{ vars.FAULT_TEMPERATURE }}
          FAULT_TOOL_ERROR_RATE: ${{ vars.FAULT_TOOL_ERROR_RATE }}
          FAULT_INJECTION_VULN: ${{ vars.FAULT_INJECTION_VULN }}
          FAULT_VERBOSITY: ${{ vars.FAULT_VERBOSITY }}
        run: |
          uv run agentgate run \
            --suite "$AGENTGATE_SUITE" \
            --system candidate \
            --store "$AGENTGATE_STORE" \
            --run-id "candidate-${{ github.sha }}"

      - name: Compare and gate
        id: gate
        continue-on-error: true
        run: |
          uv run agentgate compare \
            --baseline "baseline-${{ github.event.pull_request.base.sha || github.sha }}" \
            --candidate "candidate-${{ github.sha }}" \
            --store "$AGENTGATE_STORE" \
            --policy gate.yaml \
            --comment gate-comment.md \
            --html gate-report.html \
            --gate-json gate.json

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentgate-report
          path: |
            gate-report.html
            gate.json
            gate-comment.md
          if-no-files-found: warn

      # One sticky comment, updated in place. A gate that adds a new comment per push teaches
      # reviewers to collapse the thread.
      - name: Post or update the sticky comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agentgate-sticky-comment -->';
            const body = fs.existsSync('gate-comment.md')
              ? fs.readFileSync('gate-comment.md', 'utf8')
              : `${marker}\n## AgentGate could not produce a verdict\nSee the job log.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.gate.outcome }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request?.head?.sha || context.sha,
              state,
              context: 'agentgate/gate',
              description: state === 'success'
                ? 'No statistically significant regression'
                : 'Gate failed — see the sticky comment',
            });

      - name: Fail the build on a failing gate
        if: steps.gate.outcome != 'success'
        run: |
          echo "::error title=AgentGate::The gate blocked this change. See the sticky comment."
          exit 1
